# The reference application, and the conformance suite it doubles as.
#
# `gallery` is both: the screens the simulator opens and both firmwares flash,
# and the eight-board suite that proves them — every screen on every panel,
# against a committed PNG. `tutorial` is the screen `xpui`'s tutorial walks
# to, in a window, so the prose and the runnable thing stay side by side.
[workspace]
# `xtask` is the gate. A member rather than a separate workspace so one
# `cargo test` reaches its tests.
members = ["gallery", "tutorial", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Thiago Holanda <unnamedd@gmail.com>"]
repository = "https://github.com/XPUI-Framework/xpui-gallery"

[workspace.dependencies]
# Git dependencies, not versions: nothing is published, and a fresh clone of
# this repository has to build without its siblings on disk.
xpui = { git = "https://github.com/XPUI-Framework/xpui-framework", branch = "main" }
xpui-chrome = { git = "https://github.com/XPUI-Framework/xpui-chrome", branch = "main" }
xpui-boards-core = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-pimoroni = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-seeed = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-boards-xteink = { git = "https://github.com/XPUI-Framework/xpui-boards", branch = "main" }
xpui-embedded-graphics = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main" }
xpui-screenshot = { git = "https://github.com/XPUI-Framework/xpui-backends", branch = "main", default-features = false }
xpui-simulator = { git = "https://github.com/XPUI-Framework/xpui-simulator", branch = "main" }

xpui-gallery = { path = "gallery" }

# Three lints the compiler does not deny on its own, denied in every workspace
# root so that the table is one passage. `too_long_first_doc_paragraph` is the
# one to watch: it is a nursery lint, off by default, so clippy may rename or
# retire it — and a name clippy no longer knows is an `unknown_lints` warning,
# which `-D warnings` turns into a red gate in every repository at once.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
too_long_first_doc_paragraph = "deny"

[workspace.lints.rustdoc]
unescaped_backticks = "deny"

# What a `cargo build --release` of this repository alone produces — not what
# ships. A library's profile applies only at the top of a build; a firmware's
# workspace sets the profile for everything it links; `xpui-rp2040`,
# `xpui-esp32` and `xpui-cpp` use `opt-level = "z"`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
