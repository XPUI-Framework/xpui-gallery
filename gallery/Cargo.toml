[package]
name = "xpui-gallery"
description = "Example screens built on xpui, runnable in the simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

# A library as well as a binary: the screens are what the tests exercise, and
# a test cannot open a window.
[lib]
name = "gallery"
path = "src/lib.rs"

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
xpui.workspace = true
# The boards these screens are laid out for. Named directly rather than reached
# through the simulator, because a device build has no simulator.
# All three vendors, because this is the application that claims to fit seven
# panels. A firmware takes the one vendor it flashes.
xpui-boards-core.workspace = true
xpui-boards-pimoroni.workspace = true
xpui-boards-seeed.workspace = true
xpui-boards-xteink.workspace = true
xpui-chrome.workspace = true
# The typefaces this example adds are assembled with the backend's own macro,
# and the picker asks the backend to change family. Both are the same backend
# the RP2040 binaries already link, so this is not a desktop-only dependency.
xpui-embedded-graphics.workspace = true

# The simulator links SDL2, so it is a desktop-only dependency. A device build
# takes the same screens and supplies its own entry point.
[target.'cfg(not(target_os = "none"))'.dependencies]
xpui-simulator.workspace = true

[dev-dependencies]
xpui = { workspace = true, features = ["testing"] }
xpui-embedded-graphics = { workspace = true, features = ["testing"] }
# The host-side framebuffer its screenshot tests draw into.
xpui-screenshot = { workspace = true, features = ["golden"] }
embedded-graphics = "0.8"
