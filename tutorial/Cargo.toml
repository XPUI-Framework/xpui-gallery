[package]
name = "xpui-tutorial"
description = "The screen built step by step in the tutorial, as a runnable crate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# A library as well as a binary, for the same reason the gallery is: the tests
# drive the screen, and a test cannot open a window.
[lib]
name = "tutorial"
path = "src/lib.rs"

[[bin]]
name = "tutorial"
path = "src/main.rs"

[dependencies]
xpui.workspace = true
xpui-simulator.workspace = true
# The board the window opens on. One vendor's crate, because there is no
# "every board" crate any more — a project takes the devices it targets.
xpui-boards-xteink.workspace = true

[dev-dependencies]
xpui = { workspace = true, features = ["testing"] }
xpui-embedded-graphics = { workspace = true, features = ["testing"] }
# The host-side framebuffer its screenshot tests draw into.
xpui-screenshot = { workspace = true, features = ["golden"] }
embedded-graphics = "0.8"
